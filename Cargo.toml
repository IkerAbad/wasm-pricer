[package]
name = "wasm-pricer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Iker Abad"]
license = "MIT"
description = "Black-Scholes, Greeks, Asian Monte Carlo and an SVI volatility surface, running in WebAssembly."
repository = "https://github.com/IkerAbad/wasm-pricer"
readme = "README.md"
keywords = ["options", "black-scholes", "webassembly", "monte-carlo", "svi"]
categories = ["finance", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libm = "0.2"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

